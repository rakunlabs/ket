services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ket
      POSTGRES_PASSWORD: ket
      POSTGRES_DB: ket
    ports:
      - "5432:5432"
    volumes:
      - ket-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ket"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ket-pg:
