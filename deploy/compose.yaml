# Ket with PostgreSQL, for a one-command start:
#   docker compose -f deploy/compose.yaml up -d
# then open http://localhost:8080 and create the first account (the administrator).
#
# Set KET_POSTGRES_PASSWORD in the environment or a .env file next to this
# file for anything beyond a local trial. KET_IMAGE picks a released image
# (default: build from this checkout).

services:
  ket:
    image: ${KET_IMAGE:-ghcr.io/rakunlabs/ket:latest}
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "${KET_PORT:-8080}:8080"
    environment:
      KET_STORE_POSTGRES_DSN: postgres://ket:${KET_POSTGRES_PASSWORD:-ket}@postgres:5432/ket?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ket
      POSTGRES_PASSWORD: ${KET_POSTGRES_PASSWORD:-ket}
      POSTGRES_DB: ket
    volumes:
      - ket-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ket -d ket"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ket-data:
