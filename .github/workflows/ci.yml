name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ket
          POSTGRES_PASSWORD: ket
          POSTGRES_DB: ket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ket -d ket_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KET_TEST_DSN: postgres://ket:ket@localhost:5432/ket_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: _ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: _ui
      - run: pnpm check
        working-directory: _ui
      - run: pnpm test
        working-directory: _ui
      - run: pnpm build
        working-directory: _ui
      - name: Command catalog must match the registry
        run: git diff --exit-code -- internal/catalog/catalog.json
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  kicad:
    # export_kicad, checked by KiCad itself: the file loads and KiCad's DRC
    # finds no errors and nothing unconnected.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: _ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: _ui
      - run: pnpm exec tsx scripts/kicad-fixtures.ts kicad-out
        working-directory: _ui
      - name: KiCad DRC
        run: |
          chmod -R 777 _ui/kicad-out
          for b in example six-layer; do
            docker run --rm -v "$PWD/_ui/kicad-out:/w" -w /w --entrypoint kicad-cli kicad/kicad:9.0 pcb drc --severity-all --format json -o /w/$b.drc.json /w/$b.kicad_pcb
          done
      - run: pnpm exec tsx scripts/kicad-check.ts kicad-out/example.drc.json kicad-out/six-layer.drc.json
        working-directory: _ui
      - name: Import KiCad's demo boards
        run: |
          mkdir -p _ui/kicad-demos
          for f in pic_programmer/pic_programmer ecc83/ecc83-pp custom_pads_test/custom_pads_test microwave/microwave interf_u/interf_u; do
            docker run --rm --entrypoint cat kicad/kicad:9.0 /usr/share/kicad/demos/$f.kicad_pcb > _ui/kicad-demos/$(basename $f).kicad_pcb
          done
          docker run --rm --entrypoint cat kicad/kicad:9.0 /usr/share/kicad/template/Arduino_Nano/Arduino_Nano.kicad_pcb > _ui/kicad-demos/arduino_nano.kicad_pcb
      - run: pnpm exec tsx scripts/kicad-import-check.ts kicad-demos
        working-directory: _ui

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ket
          POSTGRES_PASSWORD: ket
          POSTGRES_DB: ket_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ket -d ket_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KET_E2E_DSN: postgres://ket:ket@localhost:5432/ket_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: _ui/pnpm-lock.yaml
      - run: make build
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: _ui
      - run: pnpm run e2e
        working-directory: _ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            _ui/playwright-report
            _ui/test-results
            _ui/e2e-logs
