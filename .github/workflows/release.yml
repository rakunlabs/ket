name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: _ui/pnpm-lock.yaml
      - run: make build-ui
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse --short HEAD)
          date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          ldflags="-s -w -X github.com/rakunlabs/ket/internal/config.Version=${VERSION} -X github.com/rakunlabs/ket/internal/config.Commit=${commit} -X github.com/rakunlabs/ket/internal/config.BuildDate=${date}"
          mkdir -p out
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="ket_${VERSION}_${os}_${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="$ldflags" -o "out/$name/ket" ./cmd/ket
            cp LICENSE README.md ket.example.yaml "out/$name/"
            tar -C out -czf "out/$name.tar.gz" "$name"
          done
          (cd out && sha256sum ./*.tar.gz > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/*.tar.gz
            out/checksums.txt

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
